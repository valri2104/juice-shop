name: Fluid Attacks scanners

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SAST
        id: scan
        uses: fluidattacks/sast-action@main
        with:
          scan_config_path: .fluidattacks/sast.yaml
          scanner_mode: full
      - name: Subir CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sast
          path: results-sast.csv

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SCA
        id: scan
        uses: fluidattacks/sca-action@main
        with:
          scan_config_path: .fluidattacks/sca.yaml
          scanner_mode: full
      - name: Subir CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sca
          path: results-sca.csv

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scan
        id: scan
        uses: fluidattacks/ss-action@main
        with:
          scan_config_path: .fluidattacks/ss.yaml
          scanner_mode: full
      - name: Subir CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ss
          path: results-ss.csv
      - name: Romper el build si hay vulnerabilidades
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "Fluid Attacks encontró vulnerabilidades (modo estricto)"
          exit 1
